<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Party Jo – Atheris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #090A0E; --bg-elevated: #0F1117;
    --surface: rgba(255,255,255,0.03); --surface-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.06); --border-hover: rgba(168,85,247,0.25);
    --text-primary: #F8FAFC; --text-secondary: #94A3B8; --text-muted: #64748B;
    --accent-purple: #A855F7; --accent-cyan: #06B6D4; --accent-green: #10B981;
    --accent-orange: #F97316; --accent-red: #EF4444; --accent-yellow: #F59E0B;
    --accent-blue: #2563EB; --shadow: 0 8px 32px rgba(0,0,0,0.35);
    --radius-lg: 24px; --radius-md: 16px; --radius-sm: 12px;
    --transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"] {
    --bg: #F1F5F9; --bg-elevated: #FFFFFF;
    --surface: rgba(0,0,0,0.03); --surface-hover: rgba(0,0,0,0.06);
    --border: rgba(0,0,0,0.08); --border-hover: rgba(168,85,247,0.35);
    --text-primary: #0F172A; --text-secondary: #475569; --text-muted: #94A3B8;
    --accent-purple: #7C3AED; --accent-cyan: #0891B2; --accent-green: #059669;
    --accent-orange: #EA580C; --accent-red: #DC2626; --accent-yellow: #D97706;
    --accent-blue: #1D4ED8; --shadow: 0 8px 32px rgba(0,0,0,0.08);
}
body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168,85,247,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.01) 0%, transparent 70%);
    color: var(--text-primary);
    min-height: 100vh; margin: 0; padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
}
[data-theme="light"] body {
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168,85,247,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.01) 0%, transparent 70%);
}
#themeToggle {
    position: fixed; top: 20px; right: 20px;
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-secondary); font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); z-index: 1000; backdrop-filter: blur(10px);
}
#themeToggle:hover {
    background: var(--surface-hover); border-color: var(--border-hover); transform: scale(1.05);
}
.back-btn {
    position: fixed; top: 16px; left: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 14px;
    color: var(--text-secondary); text-decoration: none; font-weight: 600;
    transition: var(--transition); z-index: 100;
}
.back-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); }
* { touch-action: manipulation; box-sizing: border-box; }
.hidden { display: none !important; }
input, button, select { padding: 12px; font-size: 16px; border-radius: 8px; margin: 5px; outline: none; font-family: inherit; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); transition: var(--transition); }
button { background: var(--accent-purple); color: white; border: none; cursor: pointer; }
button:hover { background: var(--accent-cyan); transform: scale(1.02); }
.area { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px; }
.flex-center { display: flex; justify-content: center; gap: 20px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; width: 100%; margin: 10px auto; }
#my-grid { max-width: 420px; gap: 8px; }
.card-container { perspective: 1000px; width:100%; aspect-ratio:2/3; cursor:pointer; position:relative; }
.card-inner { position:absolute; width:100%; height:100%; transition:transform 0.4s; transform-style:preserve-3d; }
.card-container.up .card-inner { transform:rotateY(180deg); }
.card-face { position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Times New Roman',serif; font-size:36px; font-weight:bold; border:2px solid var(--border); }
.card-back { background:linear-gradient(135deg, var(--accent-red), var(--accent-yellow), var(--accent-cyan)); background-size:200% 200%; animation:gradientShift 3s ease infinite; color:white; font-size:12px; font-family:sans-serif; }
.card-front { transform:rotateY(180deg); background:white; color:black; }
.val-neg2 { background:#1a237e; color:white; }
.val-neg1 { background:#3f51b5; color:white; }
.val-0 { background:var(--accent-cyan); color:white; }
.val-low { background:var(--accent-green); color:white; }
.val-mid { background:var(--accent-yellow); color:black; }
.val-high { background:var(--accent-red); color:white; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal-content { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; }
.pause-banner { background:rgba(239,68,68,0.15); border-left:4px solid var(--accent-red); padding:12px; border-radius:var(--radius-sm); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
@keyframes gradientShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
.opp-area { width:48%; min-width:140px; max-width:240px; }
.opp-grid { max-width:220px; gap:4px; }
.opp-grid .card-face { font-size:14px; }
.status-badge { font-size:11px; font-weight:bold; padding:4px 8px; border-radius:4px; }
.status-active { background:var(--accent-green); color:white; }
.status-inactive { background:var(--accent-orange); color:white; }
.status-kicked { background:var(--accent-red); color:white; }
.active-turn { box-shadow:0 0 20px -5px var(--accent-yellow); border-color:var(--accent-yellow); }
</style>
</head>
<body>
<button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
<a href="/" class="back-btn">← Hub</a>

<div id="lobby">
    <h1 style="color:var(--accent-yellow); font-size:44px; margin-top:5vh;">🎮 PARTY JO 🎮</h1>
    <p style="color:var(--text-muted); margin:10px 0;">Choose your emoji</p>
    <div class="emoji-picker" id="emoji-picker" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:15px 0;"></div>
    <input type="text" id="name" placeholder="Your Name" autocomplete="off" /><br>
    <button onclick="createRoom()" style="background:var(--accent-green);">Create New Room</button>
    <hr style="border-color:var(--border); width:200px; margin:20px auto;">
    <input type="text" id="join-code" placeholder="4-Digit Code" autocomplete="off" /><br>
    <button onclick="joinRoom()" style="background:var(--accent-cyan);">Join Room</button>
    <hr style="border-color:var(--border); width:200px; margin:20px auto;">
    <button onclick="showAvailableRooms()" style="background:var(--accent-orange);">Rejoin Active Room</button>
</div>

<div id="room" class="hidden">
    <h2 id="room-name"></h2>
    <p style="color:var(--text-muted); font-size:12px;">Share this code!</p>
    <div id="player-list" style="margin:20px 0;"></div>
    <button onclick="openSettings()" style="background:var(--text-muted); width:auto; padding:8px 16px; margin-bottom:10px;">⚙️ Settings</button>
    <button id="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- Modals and game sections same IDs as original, kept untouched for logic -->
<div id="settings-modal" class="modal hidden">...</div>
<div id="available-rooms-modal" class="modal hidden">...</div>
<div id="select-player-modal" class="modal hidden">...</div>
<div id="game" class="hidden">...</div>
<div id="game-over" class="hidden">...</div>

</html>
