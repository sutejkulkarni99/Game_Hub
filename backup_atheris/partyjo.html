<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Party Jo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

:root {
    --bg: #090A0E;
    --bg-elevated: #0F1117;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(168, 85, 247, 0.25);
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --accent-purple: #A855F7;
    --accent-cyan: #06B6D4;
    --accent-green: #10B981;
    --accent-orange: #F97316;
    --accent-red: #EF4444;
    --accent-yellow: #F59E0B;
    --accent-blue: #2563EB;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="light"] {
    --bg: #F1F5F9;
    --bg-elevated: #FFFFFF;
    --surface: rgba(0,0,0,0.03);
    --surface-hover: rgba(0,0,0,0.06);
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(168,85,247,0.35);
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --accent-purple: #7C3AED;
    --accent-cyan: #0891B2;
    --accent-green: #059669;
    --accent-orange: #EA580C;
    --accent-red: #DC2626;
    --accent-yellow: #D97706;
    --accent-blue: #1D4ED8;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
}
body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168, 85, 247, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.01) 0%, transparent 70%);
    color: var(--text-primary);
    margin: 0;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
}
[data-theme="light"] body {
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.01) 0%, transparent 70%);
}
#themeToggle {
    position: fixed; top: 20px; right: 20px;
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    z-index: 1000;
    backdrop-filter: blur(10px);
}
#themeToggle:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    transform: scale(1.05);
}


        :root {

            --radius-sm: 12px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

            background: var(--bg);

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

        .hidden { display: none !important; }
        .back-btn {
            position: fixed;

            border-radius: 10px;
            padding: 8px 16px;

        }
        .back-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); color: var(--text-primary); }
        input, button, select {
            padding: 12px;

        }

        input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15); }

        button:hover:not(:disabled) {

        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .area {
            background: var(--surface);
            backdrop-filter: blur(20px);

            border: 1px solid var(--border);
            border-radius: var(--radius-md);

        }
        .flex-center { display: flex; justify-content: center; gap: 20px; align-items: center; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin: 10px auto; }
        #my-grid { max-width: 420px; gap: 8px; }
        .card-container { perspective: 1000px; width: 100%; aspect-ratio: 2/3; cursor: pointer; position: relative; }
        .card-inner { position: absolute; width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; }
        .card-container.up .card-inner { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Times New Roman', serif;
            font-size: 36px;
            font-weight: bold;
            border: 2px solid white;
        }
        .card-back {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-yellow), var(--accent-cyan));
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            color: white;
            font-size: 12px;
            font-family: sans-serif;
            overflow: hidden;
        }
        .card-back::after { content: "PARTY JO"; position: absolute; transform: rotate(-45deg); font-weight: 900; font-size: 1em; white-space: nowrap; }
        .opp-grid .card-face { font-size: 14px; border-width: 1px; }
        .opp-grid .card-back { font-size: 8px; }
        .opp-grid .card-back::after { font-size: 6px; }
        .card-front { transform: rotateY(180deg); background: white; color: black; background-image: radial-gradient(rgba(0,0,0,0.1) 1px, transparent 1px); background-size: 8px 8px; }
        .val-neg2 { background-color: var(--accent-blue); color: white; }
        .val-neg1 { background-color: var(--accent-blue); color: white; }
        .val-0 { background-color: var(--accent-cyan); color: white; }
        .val-low { background-color: var(--accent-green); color: white; }
        .val-mid { background-color: var(--accent-yellow); color: black; }
        .val-high { background-color: var(--accent-red); color: white; }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(9, 10, 14, 0.95);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: var(--radius-md);
            text-align: left;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { color: var(--accent-purple); margin-top: 0; margin-bottom: 20px; font-weight: 700; }
        .modal-content label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; }
        .modal-content input { width: 100%; max-width: 100%; box-sizing: border-box; margin-bottom: 20px; }
        .announcement {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-purple);
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            z-index: 1000;
            animation: slideDown 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
        }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-30px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .pause-banner {
            background: rgba(239, 68, 68, 0.15);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin: 10px 0;
            border-left: 3px solid var(--accent-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .pause-banner button {
            background: var(--accent-green);
            color: white;

<body>
<button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>

<a href="/" class="back-btn">← Hub</a>

<div id="lobby">
    <div class="brand-logo">🃏</div>
    <h1>PARTY JO</h1>
    <p style="color: var(--text-muted); margin: 10px 0;">Choose your emoji</p>
    <div class="emoji-picker" id="emoji-picker" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 15px 0;"></div>
    <input type="text" id="name" placeholder="Your Name" autocomplete="off" /><br>
    <button onclick="createRoom()" style="background: var(--accent-green);">Create New Room</button>
    <hr style="border-color: var(--border); width: 200px; margin: 20px auto;">
    <input type="text" id="join-code" placeholder="4-Digit Code" autocomplete="off" /><br>
    <button onclick="joinRoom()" style="background: var(--accent-cyan);">Join Room</button>
    <hr style="border-color: var(--border); width: 200px; margin: 20px auto;">
    <button onclick="showAvailableRooms()" style="background: var(--accent-orange);">Rejoin Active Room</button>
</div>

<div id="room" class="hidden">
    <h2 id="room-name" style="color: var(--accent-purple); font-weight: 700;"></h2>
    <p style="color: var(--text-muted); font-size: 12px;">Share this code!</p>
    <div id="player-list" style="margin: 20px 0;"></div>
    <button onclick="openSettings()" style="background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); width: auto; padding: 8px 16px; margin-bottom: 10px;">⚙️ Settings</button>
    <button id="start-btn" onclick="startGame()">Start Game</button>
</div>

<div id="settings-modal" class="modal hidden">
    <div class="modal-content">
        <h2>⚙️ Game Settings</h2>
        <div><label>Room Name</label><input type="text" id="setting-room-name" maxlength="30" placeholder="Party Jo" /></div>
        <div><label>Target Score</label><input type="number" id="setting-target-score" min="20" max="500" value="100" /></div>
        <div><label>Disconnect Buffer (seconds)</label><input type="number" id="setting-buffer-time" min="30" max="600" value="120" /></div>
        <div><label>Rejoin Penalty (points)</label><input type="number" id="setting-penalty" min="0" max="100" value="25" /></div>
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button onclick="closeSettings()" style="flex:1; background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); width: auto;">Cancel</button>
            <button onclick="saveSettings()" style="flex:1; background: var(--accent-purple); width: auto;">Save Changes</button>
        </div>
    </div>
</div>

<div id="available-rooms-modal" class="modal hidden">
    <div class="modal-content">
        <h2>Active Rooms</h2>
        <p style="color: var(--text-muted); font-size: 13px;">Click a room to see players</p>
        <div id="rooms-list"></div>
        <button onclick="closeModal('available-rooms-modal')" style="width: 100%; margin-top: 15px; background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border);">Close</button>
    </div>
</div>

<div id="select-player-modal" class="modal hidden">
    <div class="modal-content">
        <h2 id="room-select-title" style="color: var(--accent-purple);"></h2>
        <p style="color: var(--text-muted); font-size: 13px;">Click your inactive name to rejoin</p>
        <div id="players-list"></div>
        <button onclick="closeModal('select-player-modal'); showAvailableRooms();" style="width: 100%; margin-top: 15px; background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border);">Back</button>
    </div>
</div>

<div id="game" class="hidden">
    <div id="announcements"></div>
    <div id="pause-alert"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 5px 0;">
        <h3 id="turn-indicator" style="margin: 0; flex: 1; font-size: 18px; color: var(--text-primary);"></h3>
        <span id="room-code-display" style="font-family: monospace; color: var(--accent-purple); font-size: 12px;"></span>
    </div>
    <div class="flex-center" style="align-items: flex-start; flex-wrap: wrap; margin-bottom: 15px;">
        <div class="area" style="flex: 1; min-width: 150px; padding: 10px;">
            <h4 style="margin: 0 0 10px; color: var(--accent-purple); font-size: 0.9rem;">📊 Standings</h4>
            <table id="scoreboard-table" style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <thead><tr><th style="color: var(--accent-purple);">Player</th><th style="color: var(--accent-purple);">Score</th></tr></thead>
                <tbody id="scoreboard-body"></tbody>
            </table>
        </div>
        <div class="area flex-center" style="flex: 2; min-width: 220px; padding: 15px;">
            <div>
                <div style="font-size: 10px; color: var(--text-muted); margin-bottom: 5px;">DECK</div>
                <div class="card-container" style="width: 70px;" onclick="action('draw_deck')"><div class="card-inner"><div class="card-face card-back"></div></div></div>
                <div id="deck-count" style="font-size: 11px; color: var(--text-muted); margin-top: 5px;"></div>
            </div>
            <div>
                <div style="font-size: 10px; color: var(--text-muted); margin-bottom: 5px;">DISCARD</div>
                <div class="card-container up" style="width: 70px;" onclick="action('draw_discard')" id="discard-wrapper"></div>
            </div>
        </div>
    </div>
    <div id="action-area" class="area hidden" style="border: 2px solid var(--accent-purple); padding: 15px; margin-bottom: 15px;">
        <div style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap;">
            <h4 style="margin: 0; margin-right: 10px; color: var(--text-secondary);">You Drew:</h4>
            <span id="drawn-card-val" style="display: inline-flex; padding: 8px 16px; border-radius: 6px; border: 2px solid white; font-size: 28px; font-weight: bold;"></span>
        </div>
        <button id="discard-btn" onclick="action('discard_drawn')" style="margin-top: 15px; width: auto; padding: 10px 20px; background: var(--accent-orange);">Discard & Flip</button>
    </div>
    <div id="my-area" class="area" style="padding: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0; font-size: 18px; color: var(--text-primary);">📋 My Board</h3>
            <div id="my-stats" style="font-size: 14px; color: var(--text-muted);"></div>
        </div>
        <div id="my-grid" class="grid"></div>
    </div>
    <div id="others-area" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;"></div>
</div>

<div id="game-over" class="hidden">
    <h1 id="go-title" style="font-size: 36px; margin-bottom: 10px;"></h1>
    <div id="kicked-history"></div>
    <div id="scores-container" style="max-height: 50vh; overflow-y: auto; margin-bottom: 20px;"></div>
    <div id="go-actions" style="margin-top: 20px;"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io('/partyjo');
    let currentCode = null;
    const EMOJI_LIST = ['🎲', '🃏', '🎯', '🎪', '🥳', '🎉', '🎊', '🎈', '🎁', '✨', '🌟', '💥', '🔥', '🍀', '🎮', '👾'];
    let selectedEmoji = EMOJI_LIST[Math.floor(Math.random() * EMOJI_LIST.length)];

    function buildEmojiPicker() {
        const c = document.getElementById('emoji-picker');
        c.innerHTML = '';
        EMOJI_LIST.forEach(e => {
            const s = document.createElement('span');
            s.textContent = e;
            s.style.fontSize = '24px'; s.style.cursor = 'pointer'; s.style.padding = '5px';
            s.style.borderRadius = '8px';
            s.style.border = e === selectedEmoji ? '2px solid var(--accent-purple)' : '2px solid transparent';
            s.style.backgroundColor = e === selectedEmoji ? 'var(--bg-elevated)' : 'transparent';
            s.onclick = () => { selectedEmoji = e; buildEmojiPicker(); };
            c.appendChild(s);
        });
    }
    buildEmojiPicker();

    function createRoom() {
        const name = document.getElementById('name').value.trim();
        if (!name) return showError('Enter your name');
        socket.emit('create_room', { name, emoji: selectedEmoji });
    }
    function joinRoom() {
        const name = document.getElementById('name').value.trim();
        const code = document.getElementById('join-code').value.trim();
        if (!name) { showError('Enter your name'); return; }
        if (!code || code.length !== 4 || isNaN(code)) { showError('Enter a valid 4-digit code'); return; }
        socket.emit('join_room', { code, name, emoji: selectedEmoji });
    }
    function showAvailableRooms() { socket.emit('get_available_rooms'); }
    function selectRoom(code) { socket.emit('get_room_players', code); }
    function selectPlayer(playerId, name, code) { socket.emit('join_room', { code, name }); }
    function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function startGame() { socket.emit('start_game', currentCode); }
    function action(t, i=null) { socket.emit('action', { code: currentCode, type: t, index: i }); }

    function saveSettings() {
        socket.emit('update_settings', {
            code: currentCode,
            settings: {
                roomName: document.getElementById('setting-room-name').value || 'Party Jo',
                targetScore: parseInt(document.getElementById('setting-target-score').value) || 100,
                bufferTimeSec: parseInt(document.getElementById('setting-buffer-time').value) || 120,
                rejoinPenalty: parseInt(document.getElementById('setting-penalty').value) || 25
            }
        });
        closeSettings();
    }

    function showError(m) {
        const e = document.createElement('div');
        e.style.cssText = 'position: fixed; top: 10px; right: 10px; background: var(--accent-red); color: white; padding: 15px; border-radius: var(--radius-sm); z-index: 1001; font-weight: 600; box-shadow: var(--shadow);';
        e.innerText = m; document.body.appendChild(e); setTimeout(() => e.remove(), 3000);
    }
    function showAnnouncement(msg) {
        const a = document.getElementById('announcements');
        const el = document.createElement('div'); el.className = 'announcement'; el.innerText = msg;
        a.appendChild(el); setTimeout(() => el.remove(), 4000);
    }
    function getCardClass(v) { if(v===-2) return 'val-neg2'; if(v===-1) return 'val-neg1'; if(v===0) return 'val-0'; if(v>=1&&v<=4) return 'val-low'; if(v>=5&&v<=8) return 'val-mid'; if(v>=9) return 'val-high'; return ''; }
    function createCardHTML(val, isUp, onClick="") {
        if(val===null) return '<div style="border: 2px dashed var(--border); border-radius: 6px; width: 100%; aspect-ratio: 2/3;"></div>';
        const cls = getCardClass(val); const up = isUp?'up':''; const disp = (val===6||val===9)?`<u>${val}</u>`:val;
        return `<div class="card-container ${up}" onclick="${onClick}"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front ${cls}">${disp}</div></div></div>`;
    }
    function getVisibleSum(p) { return p.grid.reduce((s,v,i)=>s+(p.visible[i]&&v!==null?v:0),0); }
    function formatTime(sec) { const m = Math.floor(sec/60); const s = sec%60; return (m>0?m+'m ':'') + s+'s'; }

    socket.on('available_rooms', (rooms) => {
        const list = document.getElementById('rooms-list');
        if (!rooms.length) { list.innerHTML = '<p style="color: var(--text-muted);">No active rooms available</p>'; }
        else { list.innerHTML = rooms.map(r => `<div class="room-item" onclick="selectRoom('${r.code}')"><strong style="color: var(--text-primary);">${r.roomName}</strong><br><span style="color: var(--text-muted); font-size: 12px;">Code: ${r.code} | ${r.playerCount} players | ${r.status}</span></div>`).join(''); }
        document.getElementById('available-rooms-modal').classList.remove('hidden');
    });

    socket.on('room_players', (room) => {
        document.getElementById('available-rooms-modal').classList.add('hidden');
        document.getElementById('room-select-title').innerText = room.roomName;
        const list = document.getElementById('players-list');
        list.innerHTML = room.players.map(p => {
            let statusClass = 'status-active', statusTxt = 'ACTIVE', clickable = false;
            if (p.kicked_pending) { statusClass = 'status-kicked'; statusTxt = 'KICKED'; }
            else if (p.disconnected) { statusClass = 'status-inactive'; statusTxt = 'INACTIVE'; clickable = true; }
            return `<div class="player-item" onclick="${clickable ? `selectPlayer('${p.id}', '${p.name}', '${room.code}')` : ''}" style="${clickable?'cursor: pointer;':'opacity: 0.6;'}"><div style="text-align: left;"><strong style="color: var(--text-primary);">${p.emoji} ${p.name}</strong><br><span style="color: var(--text-muted); font-size: 12px;">Score: ${p.score}</span></div><span class="status-badge ${statusClass}">${statusTxt}</span></div>`;
        }).join('');
        document.getElementById('select-player-modal').classList.remove('hidden');
    });

    socket.on('announcement', (msg) => showAnnouncement(msg));

    socket.on('state', (state) => {
        currentCode = state.code;
        ['lobby', 'room', 'available-rooms-modal', 'select-player-modal', 'game', 'game-over'].forEach(id => document.getElementById(id).classList.add('hidden'));

        if (state.gamePhase === 'LOBBY') {
            document.getElementById('lobby').classList.remove('hidden');
            document.getElementById('room').classList.remove('hidden');
            document.getElementById('room-name').innerText = `${state.roomName} - Code: ${state.code}`;
            const players = Object.values(state.players).filter(p => !p.kicked_pending);
            document.getElementById('player-list').innerHTML = players.map(p => `<div style="background: var(--surface); border: 1px solid var(--border); padding: 10px; margin: 5px; border-radius: var(--radius-sm); color: var(--text-primary);">${p.emoji} ${p.name}${state.hostId === p.id ? ' 👑' : ''}</div>`).join('');
            document.getElementById('start-btn').disabled = players.length < 2;
            document.getElementById('setting-room-name').value = state.roomName;
            document.getElementById('setting-target-score').value = state.settings.targetScore;
            document.getElementById('setting-buffer-time').value = state.settings.bufferTimeSec;
            document.getElementById('setting-penalty').value = state.settings.rejoinPenalty;
        } else if (['ROUND_OVER', 'MATCH_OVER', 'ABANDONED'].includes(state.gamePhase)) {
            document.getElementById('game-over').classList.remove('hidden');
            const goTitle = document.getElementById('go-title');
            if (state.gamePhase === 'ABANDONED') { goTitle.innerText = '❌ GAME ABANDONED'; goTitle.style.color = 'var(--accent-red)'; }
            else if (state.gamePhase === 'MATCH_OVER') { goTitle.innerText = '🎉 MATCH OVER 🎉'; goTitle.style.color = 'var(--accent-purple)'; }
            else { goTitle.innerText = '🏆 ROUND OVER 🏆'; goTitle.style.color = 'var(--accent-purple)'; }

            if (state.kickedHistory?.length) {
                document.getElementById('kicked-history').innerHTML = `<div class="area" style="background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--accent-red); text-align: left;"><strong style="color: var(--accent-red);">⚠️ Kicked Players:</strong><br>` + state.kickedHistory.map(k => `<span style="font-size: 12px; color: var(--text-muted);">${k.name}</span>`).join(', ') + '</div>';
            } else { document.getElementById('kicked-history').innerHTML = ''; }

            let scores = document.getElementById('scores-container');
            scores.innerHTML = '';
            if (state.gamePhase !== 'ABANDONED') {
                let sorted = Object.keys(state.globalScores).sort((a,b)=>state.globalScores[b]-state.globalScores[a]);
                sorted.forEach((name, idx) => {
                    let pid = Object.keys(state.players).find(k=>state.players[k]?.name===name);
                    let rs = state.finalScores?.[pid] || { finalScore:0 };
                    scores.innerHTML += `<div class="area" style="${idx===0?'border: 2px solid var(--accent-purple)':''}"><div style="display: flex; justify-content: space-between; align-items: center;"><div style="text-align: left;"><strong style="color: var(--text-primary);">#${idx+1} ${state.players[pid]?.emoji||''} ${name}</strong></div><div style="text-align: right;"><span style="font-size: 12px; color: var(--text-muted);">Round: ${rs.finalScore}</span><br><strong style="color: var(--accent-purple); font-size: 18px;">Total: ${state.globalScores[name]}</strong></div></div></div>`;
                });
            }
            if (state.gamePhase === 'MATCH_OVER') {
                const winner = Object.keys(state.globalScores).sort((a,b)=>state.globalScores[b]-state.globalScores[a])[0];
                document.getElementById('go-actions').innerHTML = `<h2 style="color: var(--accent-purple);">🥇 ${winner} Wins!</h2><button onclick="socket.emit('start_game', currentCode)" style="width: auto; padding: 10px 30px;">Play Again</button>`;
            } else if (state.gamePhase === 'ABANDONED') {
                document.getElementById('go-actions').innerHTML = `<p style="color: var(--accent-red);">Not enough players to continue.</p><button onclick="location.reload()" style="width: auto; padding: 10px 30px;">Return to Lobby</button>`;
            } else {
                document.getElementById('go-actions').innerHTML = `<button onclick="socket.emit('next_round', currentCode)" style="width: auto; padding: 10px 30px;">Next Round</button>`;
            }
        } else {
            document.getElementById('game').classList.remove('hidden');
            const pauseAlert = document.getElementById('pause-alert');
            if (state.pausedBy) {
                const pausedPlayer = state.players[state.pausedBy.playerId];
                const elapsed = Date.now() - (pausedPlayer.disconnectTime || Date.now());
                const remaining = Math.max(0, (state.settings.bufferTimeSec||120)*1000 - elapsed);
                const remainingSec = Math.ceil(remaining/1000);
                const isHost = state.hostId === socket.id;
                pauseAlert.innerHTML = `<div class="pause-banner"><span>⏸️ GAME PAUSED – waiting for ${pausedPlayer?.emoji||''} ${pausedPlayer?.name||'Player'} (${formatTime(remainingSec)} remaining)</span><div style="display: flex; gap: 5px;">${isHost ? `<button onclick="socket.emit('extend_buffer', {code:'${state.code}', playerId:'${state.pausedBy.playerId}', additionalSec:60})">+60s</button>` : ''}${isHost ? `<button onclick="socket.emit('kick_player', {code:'${state.code}', playerId:'${state.pausedBy.playerId}'})">Kick</button>` : ''}</div></div>`;
                pauseAlert.classList.remove('hidden');
            } else { pauseAlert.classList.add('hidden'); }

            document.getElementById('room-code-display').innerText = `${state.roomName} – ${state.code}`;
            const sb = document.getElementById('scoreboard-body');
            sb.innerHTML = '';
            Object.values(state.players).filter(p => !p.kicked_pending).forEach(p => {
                let score = state.globalScores[p.name] || 0;
                let danger = score >= (state.settings.targetScore - 20) ? 'color: var(--accent-red);' : '';
                sb.innerHTML += `<tr><td style="color: var(--text-primary);">${p.emoji} ${p.name}</td><td style="${danger}">${score}</td></tr>`;
            });

            const turnInd = document.getElementById('turn-indicator');
            const myArea = document.getElementById('my-area');
            const myPlayer = state.players[socket.id];
            if (state.gamePhase === 'SETUP') {
                let count = myPlayer?.visible?.filter(Boolean).length || 0;
                turnInd.innerHTML = `SETUP: FLIP ${2-count} MORE CARD${2-count!==1?'S':''}`;
                turnInd.style.color = 'var(--accent-red)';
                if(myArea) myArea.classList.add('active-turn');
            } else if (state.gamePhase === 'PAUSED') {
                turnInd.innerHTML = '⏸️ GAME PAUSED'; turnInd.style.color = 'var(--accent-red)';
            } else {
                let isMyTurn = state.playerOrder[state.turnIndex] === socket.id;
                turnInd.innerHTML = (state.gamePhase==='LAST_TURN'?'⚠️ LAST TURN! ':'') + (isMyTurn?'🎯 YOUR TURN!':`${state.players[state.playerOrder[state.turnIndex]]?.emoji||''} ${state.players[state.playerOrder[state.turnIndex]]?.name||'Unknown'}'s Turn`);
                turnInd.style.color = isMyTurn ? 'var(--accent-purple)' : 'var(--text-primary)';
                if(myArea) myArea.classList.toggle('active-turn', isMyTurn);
            }

            const discard = document.getElementById('discard-wrapper');
            let topD = state.discardPile[state.discardPile.length-1];
            discard.innerHTML = topD !== undefined ? createCardHTML(topD, true, "action('draw_discard')") : '<div class="card-inner"><div class="card-face card-front" style="background: var(--bg-elevated);"></div></div>';
            document.getElementById('deck-count').innerText = `Cards: ${state.deckCount || 0}`;

            const actionArea = document.getElementById('action-area');
            if (state.playerOrder[state.turnIndex] === socket.id && state.currentAction && state.gamePhase !== 'PAUSED') {
                actionArea.classList.remove('hidden');
                let vs = document.getElementById('drawn-card-val');
                if (state.currentAction.type.includes('drawn')) {
                    let c = state.currentAction.card;
                    vs.innerHTML = (c===6||c===9)?`<u>${c}</u>`:c;
                    vs.className = getCardClass(c);
                    document.getElementById('discard-btn').classList.toggle('hidden', state.currentAction.type !== 'drawn_deck');
                }
            } else { actionArea.classList.add('hidden'); }

            if (myPlayer && !myPlayer.kicked_pending) {
                document.getElementById('my-stats').innerHTML = `Sum: <b>${getVisibleSum(myPlayer)}</b>`;
                document.getElementById('my-grid').innerHTML = myPlayer.grid.map((v,i)=>createCardHTML(v, myPlayer.visible[i], `action('grid_click',${i})`)).join('');
            }
            const others = document.getElementById('others-area');
            others.innerHTML = '';
            state.playerOrder.forEach(id => {
                if (id === socket.id) return;
                let p = state.players[id];
                if (!p || p.kicked_pending) return;
                let isTurn = state.playerOrder[state.turnIndex] === id && state.gamePhase !== 'SETUP' && state.gamePhase !== 'PAUSED';
                others.innerHTML += `<div class="area opp-area" style="${isTurn?'box-shadow: 0 0 15px var(--accent-purple); border: 2px solid var(--accent-purple)':''}"><h4 style="margin: 0; font-size: 14px; color: ${isTurn?'var(--accent-purple)':'var(--text-primary)'}">${p.emoji} ${p.name}</h4><div style="font-size: 10px; color: var(--text-muted); margin-bottom: 10px;">Sum: ${getVisibleSum(p)}</div><div class="grid opp-grid">${p.grid.map((v,i)=>createCardHTML(v, p.visible[i], '')).join('')}</div></div>`;
            });
        }
    });
    socket.on('error', (msg) => showError(msg));
</script>

<script>
function toggleTheme() {
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    if (root.getAttribute('data-theme') === 'light') {
        root.removeAttribute('data-theme');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
    } else {
        root.setAttribute('data-theme', 'light');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
    }
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').textContent = '☀️';
    }
})();
</script>
</body>
</html>
