<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

:root {
    --bg: #090A0E;
    --bg-elevated: #0F1117;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(168, 85, 247, 0.25);
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --accent-purple: #A855F7;
    --accent-cyan: #06B6D4;
    --accent-green: #10B981;
    --accent-orange: #F97316;
    --accent-red: #EF4444;
    --accent-yellow: #F59E0B;
    --accent-blue: #2563EB;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="light"] {
    --bg: #F1F5F9;
    --bg-elevated: #FFFFFF;
    --surface: rgba(0,0,0,0.03);
    --surface-hover: rgba(0,0,0,0.06);
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(168,85,247,0.35);
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --accent-purple: #7C3AED;
    --accent-cyan: #0891B2;
    --accent-green: #059669;
    --accent-orange: #EA580C;
    --accent-red: #DC2626;
    --accent-yellow: #D97706;
    --accent-blue: #1D4ED8;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
}
body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168, 85, 247, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.01) 0%, transparent 70%);
    color: var(--text-primary);
    margin: 0;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
}
[data-theme="light"] body {
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.01) 0%, transparent 70%);
}
#themeToggle {
    position: fixed; top: 20px; right: 20px;
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    z-index: 1000;
    backdrop-filter: blur(10px);
}
#themeToggle:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    transform: scale(1.05);
}


        :root {
            --bg: #090A0E;

            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(168, 85, 247, 0.25);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent-purple: #A855F7;
            --accent-cyan: #06B6D4;
            --accent-green: #10B981;
            --accent-orange: #F97316;
            --accent-red: #EF4444;
            --accent-yellow: #F59E0B;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(168, 85, 247, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.01) 0%, transparent 70%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 800px; width: 100%; margin: 0 auto; text-align: center; }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 60px;
            animation: fadeSlideDown 0.7s ease-out forwards;
        }
        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
            position: relative;
            overflow: hidden;
        }
        .brand-logo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 100%);
        }
        .brand-text h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }
        .brand-text h1 span { color: var(--accent-purple); }
        .brand-text p { font-size: 0.875rem; color: var(--text-muted); margin-top: 2px; }
        .subtitle {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 40px;
            animation: fadeSlideUp 0.7s ease-out 0.2s forwards;
            opacity: 0;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            animation: fadeSlideUp 0.7s ease-out 0.4s forwards;
            opacity: 0;
        }
        .game-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: var(--surface-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow), 0 0 40px -10px var(--accent);
        }
        .game-card:hover::before { opacity: 0.8; }
        .game-card:nth-child(1) { --accent: var(--accent-green); animation-delay: 0.1s; }
        .game-card:nth-child(2) { --accent: var(--accent-orange); animation-delay: 0.2s; }
        .game-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .game-card:hover .game-icon {
            transform: scale(1.08) rotate(-3deg);
            border-color: var(--accent);
            box-shadow: 0 0 20px -5px var(--accent);
        }
        .game-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .game-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .play-btn {
            margin-top: 8px;
            padding: 10px 24px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            border: none;
            pointer-events: none;
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .brand-text h1 { font-size: 1.3rem; }
            .game-grid { grid-template-columns: 1fr; }
        }
    
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>

    <div class="container">
        <div class="brand">
            <div class="brand-logo">🎮</div>
            <div class="brand-text">
                <h1>Game <span>Hub</span></h1>
                <p>Choose your game</p>
            </div>
        </div>
        <div class="subtitle">Choose your game</div>
        <div class="game-grid">
            <a href="/partyjo" class="game-card">
                <div class="game-icon">🃏</div>
                <h2>Party Jo</h2>
                <p>Multiplayer card elimination game inspired by Skyjo</p>
                <span class="play-btn">PLAY NOW</span>
            </a>
            <a href="/tambola" class="game-card">
                <div class="game-icon">🎟️</div>
                <h2>Tambola</h2>
                <p>Classic Indian Housie with tickets & patterns</p>
                <span class="play-btn">PLAY NOW</span>
            </a>
        </div>
    </div>

<script>
function toggleTheme() {
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    if (root.getAttribute('data-theme') === 'light') {
        root.removeAttribute('data-theme');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
    } else {
        root.setAttribute('data-theme', 'light');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
    }
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').textContent = '☀️';
    }
})();
</script>
</body>
</html>
